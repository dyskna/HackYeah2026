<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Błąd kodu aktywacyjnego</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Doto:wght@900&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;family=IBM+Plex+Sans+Condensed:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#15171A}a:hover{color:#3F4542}
.osoby{-webkit-appearance:none;appearance:none;width:100%;height:44px;margin:0;background:transparent;cursor:pointer}
.osoby::-webkit-slider-runnable-track{height:10px;background:#15171A;border-radius:2px}
.osoby::-moz-range-track{height:10px;background:#15171A;border-radius:2px}
.osoby::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:38px;margin-top:-14px;background:#F5C400;border:2px solid #15171A;border-radius:4px;box-shadow:0 3px 0 #15171A}
.osoby::-moz-range-thumb{width:24px;height:34px;background:#F5C400;border:2px solid #15171A;border-radius:4px;box-shadow:0 3px 0 #15171A}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #CDD1CA; color: #15171A; font-family: 'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif; font-size: 16px; line-height: 1.35; padding: 28px 24px 24px; display: flex; flex-direction: column">
<div style="display: flex; flex-direction: column; gap: 4px; padding: 10px 12px 12px; background: #0E0F10; border: 2px solid #15171A; border-radius: 4px; box-shadow: inset 0 0 0 3px #26292A"><div style="font-family: 'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif; font-weight: 600; font-size: 12px; letter-spacing: 0.1em; text-transform: uppercase; color: #A9ADA8">Aktywacja</div><div style="display: flex; align-items: center; gap: 6px; font-family: Doto, 'Courier New', monospace; font-weight: 900; font-size: 64px; line-height: 1; color: #FF5A4D">STOP</div><div style="font-size: 13px; line-height: 1.3; color: #D7DAD4">Ten telefon nie został dodany</div></div><h1 style="margin: 0; font-family: 'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif; font-weight: 700; font-size: 38px; line-height: 1.02; text-transform: uppercase; margin-top: 20px">{{tytul}}</h1><p style="margin: 12px 0 0; font-size: 17px">{{opis}}</p><div style="display: flex; flex-direction: column; gap: 6px; margin-top: 28px; padding: 16px; border: 2px solid #15171A; border-radius: 4px; background: #E6E8E3"><div style="font-family: 'IBM Plex Sans Condensed', 'Arial Narrow', sans-serif; font-weight: 600; font-size: 13px; letter-spacing: 0.08em; text-transform: uppercase; color: #3F4542">Co dalej</div><div style="font-size: 16px">Poproś administratora budynku o nowy kod QR i zeskanuj go aparatem telefonu.</div></div><div style="margin-top: auto; font-size: 14px; color: #3F4542">Bez aktywnego kodu nie można wzywać windy z tego telefonu.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"wariant": {"editor": "enum", "options": ["wygasły", "nieprawidłowy", "wykorzystany"], "default": "wygasły"}, "$preview": {"width": 390, "height": 844}}'>
class Component extends DCLogic {
renderVals() {
var w = this.props.wariant ?? 'wygasły';
var t = {
'wygasły': ['Kod wygasł', 'Ten kod aktywacyjny stracił ważność.'],
'nieprawidłowy': ['Kod jest nieprawidłowy', 'Nie rozpoznajemy tego kodu. Sprawdź, czy skanujesz kod otrzymany od administratora.'],
'wykorzystany': ['Kod został już wykorzystany', 'Każdy kod aktywuje tylko jeden telefon.']
};
var c = t[w] || t['wygasły'];
return { tytul: c[0], opis: c[1] };
}
}
</script>
</body>
</html>
